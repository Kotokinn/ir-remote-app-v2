<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(79, 70, 229, 0.35);
    }

    /* Both icons are always in the markup; only the one matching <body>'s state class is shown, so
       swapping the icon is a CSS/SVG edit here — no Rust rebuild needed to try a different look. */
    .icon-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-badge svg {
      display: none;
      width: 32px;
      height: 32px;
    }

    /* Lucide icons (ISC license, free) — same set the app itself uses, so this page matches its look. */
    body.success .icon-badge {
      background: #dcfce7;
    }

    body.success .icon-badge .icon-success {
      display: block;
      color: #16a34a;
    }

    body.error .icon-badge {
      background: #fee2e2;
    }

    body.error .icon-badge .icon-error {
      display: block;
      color: #dc2626;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      color: #1f2937;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #6b7280;
      margin: 0;
    }

    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body class="__STATE__">
  <div class="card">
    <div class="icon-badge">
      <svg class="icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.801 10A10 10 0 1 1 17 3.335" />
        <path d="m9 11 3 3L22 4" />
      </svg>
      <svg class="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
      </svg>
    </div>
    <h1>__TITLE__</h1>
    <p>__MESSAGE__</p>
    <div class="hint">This window will try to close automatically.</div>
  </div>
  <script>setTimeout(function () { window.close(); }, 500);</script>
</body>

</html>
